name: Sync articles

# Keeps content/issues.json in step with the GitHub Issues used as articles, so the site never
# needs the rate-limited public API. Committing triggers the normal Vercel deploy.
on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-articles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/sync-articles.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/issues.json
          git diff --staged --quiet || (git commit -m "chore: sync articles from issues" && git push)
